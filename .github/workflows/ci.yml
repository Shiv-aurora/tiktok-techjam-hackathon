name: CI

on:
  push:
    branches:
      - main
      - "zerocommit/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck, test, and build
        run: npm run check
      - name: Run flagship ZeroCommit OFF/ON evidence
        run: npm run demo:attack

  integrate-runtime-effects:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/zerocommit/runtime-agent-integration'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zerocommit/runtime-agent-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract and apply focused runtime integration
        shell: bash
        run: |
          git show eca37f420b69042243baf5be05e6ac856f3dd91a:.github/workflows/runtime-agent-integration.yml > /tmp/runtime-agent-integration.yml
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" /tmp/runtime-agent-integration.yml | sed '1d;$d' | sed 's/^          //' > /tmp/apply-runtime-integration.py
          python - <<'PATCH'
          from pathlib import Path
          patch = Path('/tmp/apply-runtime-integration.py')
          text = patch.read_text()
          needle = 'replace_once("apps/server/src/agent-service.ts", old_run, new_run)'
          replacement = "\n".join([
              'service_file = Path("apps/server/src/agent-service.ts")',
              'service_text = service_file.read_text()',
              'service_start = service_text.index("      const result = await this.runner.run({")',
              'service_end = service_text.index(\'      await this.store.mutate((database) => {\\n        requiredTransaction(database, transaction.id).status = "committing";\\n      });\\n\', service_start)',
              'service_file.write_text(service_text[:service_start] + new_run + service_text[service_end:])',
          ])
          if needle not in text:
              raise SystemExit('AgentService patch call not found')
          patch.write_text(text.replace(needle, replacement, 1))
          PATCH
          python /tmp/apply-runtime-integration.py
          python - <<'PATCH'
          from pathlib import Path
          for name in [
              'apps/server/src/store.ts',
              'apps/server/src/agent-runtime-integration.test.ts',
          ]:
              file = Path(name)
              file.write_text(file.read_text().replace('"\n"', '"\\n"'))
          test = Path('apps/server/src/agent-service.test.ts')
          text = test.read_text()
          needle = '    expect(service.getTransaction(run.transactionId ?? "")).toMatchObject({\n'
          replacement = '    await expect.poll(() => service.getTransaction(run.transactionId ?? "").cleanupStatus).toBe("completed");\n' + needle
          if needle not in text:
              raise SystemExit('cleanup assertion anchor not found')
          test.write_text(text.replace(needle, replacement, 1))
          PATCH
      - name: Validate integrated repository
        run: |
          npm ci
          npm run check
          npm audit --omit=dev --audit-level=high
          npm run demo:attack
      - name: Commit validated integration and restore normal CI
        shell: bash
        run: |
          git show bdd3c723d627032bf519fb4ab6371bffecb01240:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .runtime-integration-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist runtime effects in Agent transactions [runtime-agent-integration]"
          git push origin HEAD:zerocommit/runtime-agent-integration
