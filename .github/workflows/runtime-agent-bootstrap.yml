name: Bootstrap runtime agent integration

on:
  push:
    branches:
      - zerocommit/runtime-agent-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zerocommit/runtime-agent-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract and apply implementation patch
        shell: bash
        run: |
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/runtime-agent-integration.yml | sed '1d;$d' | sed 's/^          //' > /tmp/apply-runtime-integration.py
          python /tmp/apply-runtime-integration.py
      - name: Install dependencies
        run: npm ci
      - name: Validate repository and flagship containment
        run: |
          npm run check
          npm audit --omit=dev --audit-level=high
          npm run demo:attack
      - name: Commit validated integration
        shell: bash
        run: |
          rm -f .github/workflows/runtime-agent-integration.yml
          rm -f .github/workflows/runtime-agent-bootstrap.yml
          rm -f .runtime-integration-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist runtime effects in Agent transactions [runtime-agent-integration]"
          git push origin HEAD:zerocommit/runtime-agent-integration
