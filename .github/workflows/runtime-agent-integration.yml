name: Apply runtime agent integration

on:
  push:
    branches:
      - zerocommit/runtime-agent-integration

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-agent-integration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zerocommit/runtime-agent-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          def write(path: str, content: str) -> None:
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

